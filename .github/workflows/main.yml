name: sasaxcheatz-bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install QR Tools
        run: npm install -g qrcode-terminal qrcode

      - name: Start AI Bot
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: |
          npm start

      - name: Generate QR Image
        run: |
          qrcode "https://github.com" -o qr.png

      - name: Upload QR
        uses: actions/upload-artifact@v4
        with:
          name: qr-code
          path: qr.png
